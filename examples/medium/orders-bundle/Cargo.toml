[package]
name = "orders-bundle"
description = "Application-layer illustration: depends on contracts, never on another bundle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kernel = { workspace = true }
kernel-core = { workspace = true }
orders-contracts = { path = "../orders-contracts" }
ledger-contracts = { path = "../ledger-contracts" }
audit-contracts = { path = "../audit-contracts" }
# No runtime. The desk's periodic wait is `Shutdown::sleep_until_draining`,
# which the kernel publishes, so this bundle names no executor and no timer —
# the `tokio` below is what runs the tests, and nothing else.

[dev-dependencies]
kernel-testkit = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }

[lints]
workspace = true
