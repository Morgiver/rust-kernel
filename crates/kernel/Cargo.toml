[package]
name = "kernel"
description = "State machine that owns an object graph and a set of long-running tasks, and guarantees the order in which they are born, run and die."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# No crates.io release is planned. The flag is the guard: a stated intention
# nothing enforces is not one. One line to undo if that ever changes.
publish = false

[features]
default = ["signals"]
signals = ["tokio/signal"]
# Exposes the low-level hook `kernel-testkit` needs. NEVER enable it from a
# non-dev dependency: ci/check-testing-feature.sh fails the build if you do.
#
# What that guard buys, exactly: in a production graph the feature is off and
# `__register_hook` does not exist. It does NOT keep the hook out of reach
# inside `cargo test` of a crate that dev-depends on `kernel-testkit` — cargo
# unifies features across that build, so the hook is callable there from any
# test. That is intended; the boundary is the production graph, not the type.
testing = []

[dependencies]
kernel-core = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "test-util"] }

[lints]
workspace = true
