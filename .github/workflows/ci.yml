# Guards. Design section 16: a boundary asserted but not verified does not
# exist. Every job here fails the build — none of them warns.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - run: cargo fmt --all --check

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - name: Clippy, every target, every feature
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy without default features
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - run: cargo test --workspace --all-features --locked

  no-default-features:
    name: build without default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      # Signal capture sits behind a feature, so the kernel must build and pass
      # its suite with every default feature switched off.
      - run: cargo build --workspace --all-targets --no-default-features --locked
      - run: cargo test --workspace --no-default-features --locked

  msrv:
    name: build and test on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version is READ FROM Cargo.toml. Hardcoding it here would reproduce
      # the defect this job exists to catch: a `rust-version` nothing verifies
      # drifts, and drifted unnoticed for two waves.
      - name: Read the declared MSRV
        id: msrv
        run: echo "version=$(./ci/msrv.sh)" >> "$GITHUB_OUTPUT"
      - name: Install the declared MSRV
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal --no-self-update
      - name: Build
        run: cargo "+${{ steps.msrv.outputs.version }}" build --workspace --all-targets --all-features --locked
      - name: Test
        run: cargo "+${{ steps.msrv.outputs.version }}" test --workspace --all-features --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      # `missing_docs = "deny"` is declared in the workspace lints and rustdoc
      # applies it, so an undocumented public item fails here. `-D warnings`
      # adds the rustdoc-only lints: broken links, invalid code blocks.
      - name: Document, warning-free
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  boundaries:
    name: boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Lint configuration is still in place
        run: ./ci/check-lints.sh
      - name: Licence files match what Cargo.toml claims
        run: ./ci/check-licenses.sh
      - name: Dependency allowlist
        run: ./ci/check-dependencies.sh
      - name: No domain, transport or technology name
        run: ./ci/check_vocabulary.py
      - name: No bundle depends on another bundle
        run: ./ci/check-bundle-graph.sh
      - name: No production dependency enables kernel/testing
        run: ./ci/check-testing-feature.sh

  without-macros:
    name: suite without the macros crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - run: ./ci/check-without-macros.sh

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Cache cargo-deny
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-0.19
      - name: Install cargo-deny
        run: command -v cargo-deny >/dev/null || cargo install cargo-deny --locked --version ^0.19
      # Warnings are denied: an advisory, an unmaintained crate and a stale
      # entry in deny.toml all stop the build.
      - name: Advisories, licences, bans, sources
        run: cargo deny --all-features check --deny warnings

  public-api:
    name: public surface matches the baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both pins are READ FROM the guard, never repeated here — same reason
      # the MSRV job reads Cargo.toml: a version written in two places drifts,
      # and a baseline diffed under the wrong nightly reports the compiler
      # rather than the code.
      - name: Read the pinned toolchain and tool version
        id: pins
        run: |
          echo "toolchain=$(./ci/check-public-api.sh --print-toolchain)" >> "$GITHUB_OUTPUT"
          echo "tool=$(./ci/check-public-api.sh --print-tool-version)" >> "$GITHUB_OUTPUT"
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      # rustdoc's JSON output is nightly-only. `--profile minimal` because the
      # only thing wanted from this toolchain is rustdoc.
      - name: Install the pinned nightly
        run: rustup toolchain install "${{ steps.pins.outputs.toolchain }}" --profile minimal --no-self-update
      # Building the tool from source costs minutes. The binary is cached on the
      # pinned version, so only a version bump pays that cost; every other run
      # restores it and the install step is a no-op.
      - name: Cache cargo-public-api
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-public-api
          key: cargo-public-api-${{ runner.os }}-${{ steps.pins.outputs.tool }}
      - name: Install cargo-public-api
        run: command -v cargo-public-api >/dev/null || cargo install cargo-public-api --locked --version "${{ steps.pins.outputs.tool }}"
      - name: The public surface still matches api/
        run: ./ci/check-public-api.sh
